name: Promote to pre-prod

on:
  pull_request:
    types: [closed]
    branches: [pre-prod]
  workflow_dispatch:
    inputs:
      staging_branch:
        description: "The staging/X.Y.Z branch that was (or should be treated as) promoted to pre-prod"
        required: true
        type: string

jobs:
  prerelease:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout pre-prod
        uses: actions/checkout@v4
        with:
          ref: pre-prod

      - name: Determine the staging branch being promoted
        id: source
        run: |
          echo "branch=${{ github.event.inputs.staging_branch || github.event.pull_request.head.ref }}" >> "$GITHUB_OUTPUT"

      - name: Read release version
        id: version
        run: |
          VERSION=$(jq -r '.release' info/version.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute next rc number
        # staging/X.Y.Z is never retired at this stage (see the staging/release branch
        # model) - a fix can land on it and get re-promoted after the first pre-prod
        # deploy, so the pre-release tag can't just always be -rc1: a second promotion
        # of the same cycle would collide on a duplicate tag and actions/create-release
        # would hard-fail. List existing releases, find the highest existing rc for
        # this version, and go one past it.
        id: rc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAX_RC=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '[.[] | .tag_name | select(startswith("${{ steps.version.outputs.version }}-rc")) | ltrimstr("${{ steps.version.outputs.version }}-rc") | tonumber] | max // 0')
          echo "next=$((MAX_RC + 1))" >> "$GITHUB_OUTPUT"

      - name: Create GitHub pre-release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}-rc${{ steps.rc.outputs.next }}
          release_name: ${{ steps.version.outputs.version }}-rc${{ steps.rc.outputs.next }} (pre-release)
          body: |
            Pre-release for ${{ steps.version.outputs.version }}, now deployed to pre-prod
            from `${{ steps.source.outputs.branch }}`.
          prerelease: true
