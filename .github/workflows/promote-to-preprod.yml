name: Promote to pre-prod

on:
  pull_request:
    types: [closed]
    branches: [pre-prod]
  workflow_dispatch:
    inputs:
      staging_branch:
        description: "The staging/X.Y.Z branch that was (or should be treated as) promoted to pre-prod"
        required: true
        type: string

jobs:
  prerelease:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout pre-prod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: pre-prod

      - name: Determine the staging branch being promoted
        id: source
        # Branch names are attacker-controlled text: keep them in env vars, never in the script.
        env:
          STAGING_INPUT: ${{ github.event.inputs.staging_branch }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "branch=${STAGING_INPUT:-$PR_HEAD_REF}" >> "$GITHUB_OUTPUT"

      - name: Read release version
        # Composes in the alpha/beta qualifier if one was set via a /alpha or /beta PR
        # comment (see set-prerelease-type.yml) - info/version.json.release itself
        # always stays pure X.Y.Z semver, so this is the one place that turns it into
        # the actual display/tag version everything downstream uses.
        id: version
        run: |
          RELEASE=$(jq -r '.release' info/version.json)
          QUALIFIER=$(jq -r '.prerelease_type // empty' info/version.json)
          if [ -n "$QUALIFIER" ]; then
            VERSION="${RELEASE}-${QUALIFIER}"
          else
            VERSION="$RELEASE"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute next rc number
        # staging/X.Y.Z is never retired at this stage (see the staging/release branch
        # model) - a fix can land on it and get re-promoted after the first pre-prod
        # deploy, so the pre-release tag can't just always be -rc1: a second promotion
        # of the same cycle would collide on a duplicate tag and actions/create-release
        # would hard-fail. List existing releases, find the highest existing rc for
        # this version, and go one past it.
        id: rc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # $ENV belongs to the jq filter, not the shell
          # shellcheck disable=SC2016
          MAX_RC=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | .tag_name | select(startswith($ENV.VERSION + "-rc")) | ltrimstr($ENV.VERSION + "-rc") | tonumber] | max // 0')
          echo "next=$((MAX_RC + 1))" >> "$GITHUB_OUTPUT"

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          RC: ${{ steps.rc.outputs.next }}
          BRANCH: ${{ steps.source.outputs.branch }}
        # No --target, like the archived actions/create-release it replaces: the tag is
        # created on the repository's default branch.
        run: |
          TAG="${VERSION}-rc${RC}"
          # the backticks are literal Markdown
          # shellcheck disable=SC2016
          NOTES="$(printf 'Pre-release for %s, now deployed to pre-prod\nfrom `%s`.\n' "$VERSION" "$BRANCH")"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "$TAG (pre-release)" --notes "$NOTES"
