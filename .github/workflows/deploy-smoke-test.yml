name: Deployment smoke test

# Gates BOTH promotion PRs (staging -> pre-prod and pre-prod -> main): brings the real
# stack up behind the same Traefik config used for local testing (see
# traefik-testing/readme.md), checks every long-running service's healthcheck, and
# checks CORS headers on each routed endpoint - both that an allowed origin is let
# through and that a disallowed one is actually blocked, not just that some header is
# present (a wildcard '*' config would pass a present-only check even when domain
# restriction is completely broken - confirmed the hard way locally: mapproxy and
# elevation_api both leaked their own backend-default "Access-Control-Allow-Origin: *"
# straight through Traefik for origins that were never supposed to be allowed).
# This must be a required status check on both main's AND pre-prod's branch protection
# rules - a broken stack cannot be merged to either. Set that requirement in repo
# settings; it can't be configured from this workflow file.
#
# No paths: filter - deliberately runs on every PR into main or pre-prod regardless
# of which files changed. Confirmed for real: a normal release cycle only bumps
# info/version.json's placeholder, never compose.yml itself (that only changes when
# update-versions.yml or a human bumps an image tag), so a paths: [compose.yml] filter meant
# this never actually ran for two full production releases (2.0.4, 2.0.5) - they
# shipped with zero automated health/CORS verification and nothing even flagged it
# as missing (mergeable_state showed "clean" throughout). The check is cheap and
# fully self-contained, so running it on every promotion is the correct default.

on:
  pull_request:
    branches: [main, pre-prod]
  workflow_dispatch: {}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block merge while a staging fix-PR is still pending
        # Only relevant when this run is gating the pre-prod -> main PR specifically -
        # a staging -> pre-prod PR has no "is another fix still pending" concern of its
        # own. Guards the merge order, not just the merge itself: staging/X.Y.Z can be
        # re-promoted with a fix after its first trip to pre-prod (see the
        # staging/release branch model), which opens a second staging -> pre-prod PR.
        # If pre-prod -> main gets merged while that fix-PR is still open, production
        # ships without the fix. Runs before the expensive stack-boot steps below so
        # it fails fast.
        if: github.event_name != 'pull_request' || github.event.pull_request.base.ref == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PENDING=$(gh pr list --repo "${{ github.repository }}" --base pre-prod --state open \
            --json headRefName --jq '[.[] | select(.headRefName | startswith("staging/"))] | length')
          if [ "$PENDING" -gt 0 ]; then
            echo "There is still an open staging/* -> pre-prod PR - merge or close it before promoting pre-prod to main."
            exit 1
          fi

      - name: Write placeholder .env
        # CORS_ALLOWED_ORIGINS deliberately mirrors production's real domain-bound
        # shape (two specific origins, not '*') so the CORS check below actually
        # exercises the allow/deny logic instead of trivially passing against a
        # wildcard that can never fail. Must run before "Validate compose file" -
        # compose.yml uses required (?Variable not set) env vars, so validating
        # against no .env at all fails every time regardless of whether the file is
        # actually valid. Confirmed via a real run: this ordering bug meant this
        # check had never actually passed since path-filtering on compose.yml was
        # added - it always failed at validation before ever reaching the real
        # health/CORS checks that are the actual point of this workflow.
        run: |
          cat > .env <<'EOF'
          CORS_ALLOWED_ORIGINS=https://svalbardwatch.example.com,https://staging.svalbardwatch.example.com
          SWI_MAPPROXY_REPLICAS=1
          SWI_TITILER_REPLICAS=1
          SWI_METOBS_REPLICAS=1
          SWI_REDIS_PWD=smoke-test-password
          SWI_FRONTEND_HOST=portal.localhost
          SWI_MAPPROXY_HOST=mapserver.localhost
          SWI_APIS_HOST=api.localhost
          NUXT_PUBLIC_ENDPOINTS_API_METOBS=/api/v3
          NUXT_PUBLIC_ENDPOINTS_API_TILES=/tiles
          NUXT_PUBLIC_ENDPOINTS_API_ELEVATION=/oeapi/v1
          NUXT_PUBLIC_ENDPOINTS_MAPSERVERS_MAPPROXY=/mapserver
          NUXT_BACKEND_METOBS=http://met-public-api:8085/v3
          NUXT_BACKEND_TILES=http://titiler-cache
          NUXT_BACKEND_ELEVATION=http://elevation_api:8080/api
          NUXT_BACKEND_MAPPROXY=http://mapproxy-server:8080
          SWI_METOBS_API_ROUTE=/public/
          SWI_METOBS_INTERNAL_PORT=8085
          SWI_TITILER_API_ROUTE=/tiles/
          SWI_ELEVATION_API_ROUTE=/oeapi/
          SWI_SEAICE_MONITORING_ENDPOINT=http://127.0.0.1
          SWI_AVALANCHE_MONITORING_ENDPOINT=http://127.0.0.1
          SWI_METOBS_HOLFUY_API_KEY=smoke-test-key
          SWI_METOBS_FROST_API_KEY=smoke-test-key
          EOF

      - name: Validate compose file
        run: docker compose -f compose.yml config >/dev/null

      - name: Resolve *.localhost hostnames explicitly
        run: |
          echo "127.0.0.1 mapserver.localhost api.localhost portal.localhost dashboard.docker.localhost" | sudo tee -a /etc/hosts

      - name: Create external network (Dokploy provides this in production)
        run: docker network create dokploy-network

      - name: Generate local TLS cert for Traefik
        run: |
          mkdir -p traefik-testing/certs
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout traefik-testing/certs/local.key -out traefik-testing/certs/local.crt \
            -subj "/CN=*.localhost"

      - name: Start Traefik
        run: docker compose -f traefik-testing/compose.yml up -d

      - name: Log in to GHCR
        # swi-frontend is a private package for now. Its "Manage Actions access" setting
        # must grant this repository read access, otherwise the pull below fails with
        # "unauthorized". Harmless for the public images. Not available to forked PRs
        # (no token), where the stack pull would fail the same way.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Bring the stack up
        # Cron containers excluded: they need real upstream API keys to fetch live data
        # and aren't part of the "does the stack come up healthy and route correctly"
        # question this gate asks.
        run: docker compose -f compose.yml up -d redis mapproxy-server met-public-api met-tilling-api titiler-cache elevation_api frontend

      - name: Wait for services to report healthy
        # Iterates every container per service, not just one: `docker compose ps -q`
        # returns one ID per line per replica, and a bare `cid=$(...)` assignment
        # (the previous version of this step) collapses all of them into a single
        # multi-line string that `docker inspect` can't resolve - dormant only
        # because this check never actually ran against real replica counts before
        # (see the paths: filter fix above), and CI now deliberately runs with
        # replicas set to 1. Hardened here so it stays correct regardless.
        run: |
          timeout=300
          elapsed=0
          services="mapproxy-server met-public-api met-tilling-api titiler-cache elevation_api frontend"
          while true; do
            unhealthy=""
            for s in $services; do
              for cid in $(docker compose -f compose.yml ps -q "$s"); do
                status=$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || echo "unknown")
                if [ "$status" != "healthy" ]; then
                  unhealthy="$unhealthy $s:${cid:0:12}($status)"
                fi
              done
            done
            if [ -z "$unhealthy" ]; then
              echo "All services healthy."
              break
            fi
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "Timed out waiting for:$unhealthy"
              docker compose -f compose.yml logs
              exit 1
            fi
            echo "Waiting on:$unhealthy"
            sleep 10
            elapsed=$((elapsed + 10))
          done

      - name: CORS check
        run: |
          set -e
          allowed_header() {
            curl -k -s -D - -o /dev/null -H "Origin: $2" "$1" | tr -d '\r' | grep -i '^access-control-allow-origin:' || true
          }
          check_allowed() {
            name="$1"; url="$2"; origin="$3"
            header=$(allowed_header "$url" "$origin")
            if [ -z "$header" ]; then
              echo "FAIL: $name ($url) - origin $origin should be allowed but got no access-control-allow-origin header"
              exit 1
            fi
            echo "OK: $name allows $origin -> $header"
          }
          check_blocked() {
            name="$1"; url="$2"; origin="https://not-allowed.invalid"
            header=$(allowed_header "$url" "$origin")
            if [ -n "$header" ]; then
              echo "FAIL: $name ($url) - disallowed origin $origin got '$header' (CORS_ALLOWED_ORIGINS is not actually being enforced - a backend or Traefik default may be leaking through)"
              exit 1
            fi
            echo "OK: $name correctly blocks $origin"
          }
          for svc in "mapproxy https://mapserver.localhost/" "titiller https://api.localhost/tiles/" "elevationapi https://api.localhost/oeapi/" "metobs-backend https://api.localhost/public/"; do
            set -- $svc
            check_allowed "$1" "$2" "https://svalbardwatch.example.com"
            check_allowed "$1" "$2" "https://staging.svalbardwatch.example.com"
            check_blocked "$1" "$2"
          done

      - name: Frontend and titiler cache check
        # The frontend must answer on its own host, and the titiler route must be served
        # through the nginx cache: the second identical request has to be a HIT.
        run: |
          set -e
          code=$(curl -k -s -o /dev/null -w '%{http_code}' https://portal.localhost/)
          [ "$code" = "200" ] || { echo "FAIL: frontend returned $code"; exit 1; }
          echo "OK: frontend answers 200"
          url=https://api.localhost/tiles/openapi.json
          curl -k -s -o /dev/null "$url"
          status=$(curl -k -s -D - -o /dev/null "$url" | tr -d '\r' | grep -i '^x-cache-status:' | awk '{print $2}')
          [ "$status" = "HIT" ] || { echo "FAIL: second titiler request was '$status', expected HIT"; exit 1; }
          echo "OK: titiler response served from cache (HIT)"
          # The frontend's same-origin proxy only forwards a fixed header whitelist (no
          # X-Cache-Status), so prove the request went through the cache by its
          # Cache-Control: nginx hides titiler's own and sets "public, max-age=600".
          headers=$(curl -k -s -D - -o /dev/null https://portal.localhost/tiles/openapi.json | tr -d '\r')
          echo "$headers" | head -1 | grep -q ' 200' || { echo "FAIL: frontend /tiles proxy did not return 200"; echo "$headers"; exit 1; }
          echo "$headers" | grep -iq '^cache-control:.*max-age=600' || { echo "FAIL: frontend /tiles response did not come through the titiler cache"; echo "$headers"; exit 1; }
          echo "OK: frontend /tiles proxy goes through the titiler cache"

      - name: Staging auth check
        # Re-deploys the Traefik-labelled services with the staging gate switched on and
        # asserts every public host demands the password (and accepts it). Runs after the
        # CORS check on purpose: with auth on, unauthenticated CORS probes would just see 401.
        run: |
          set -e
          hash=$(openssl passwd -apr1 smoke-pass)
          {
            echo "SWI_AUTH_MIDDLEWARE=swi-gate"
            echo "SWI_BASICAUTH_USERS='smoke:${hash}'"
          } >> .env
          docker compose -f compose.yml up -d frontend mapproxy-server met-public-api titiler-cache elevation_api
          sleep 20
          for url in https://portal.localhost/ https://mapserver.localhost/ https://api.localhost/tiles/openapi.json https://api.localhost/public/ https://api.localhost/oeapi/; do
            anon=$(curl -k -s -o /dev/null -w '%{http_code}' "$url")
            [ "$anon" = "401" ] || { echo "FAIL: $url returned $anon without credentials, expected 401"; exit 1; }
            authed=$(curl -k -s -o /dev/null -w '%{http_code}' -u smoke:smoke-pass "$url")
            [ "$authed" != "401" ] || { echo "FAIL: $url rejected valid credentials"; exit 1; }
            echo "OK: $url -> 401 anonymous, $authed with credentials"
          done

      - name: Tear down
        if: always()
        run: |
          docker compose -f compose.yml down -v
          docker compose -f traefik-testing/compose.yml down -v
          docker network rm dokploy-network || true
