name: Update version info

on:
  push:
    branches-ignore:
      - "main"

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
    steps:
      - name: Checkout repository  # zizmor: ignore[artipacked] credentials needed: EndBug/add-and-commit pushes the regenerated info
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: PIP Install
        run: pip install pyyaml

      - name: Run Python script
        id: run-script
        run: |
          python update-info.py | tee output.txt
          if grep -q "Up-to-date - Nothing to change" output.txt; then
            echo "version-updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "version-updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update release date if needed
        id: update_date
        run: |
          TODAY=$(date +'%Y-%m-%d')
          CURRENT_DATE=$(jq -r '.release_date' info/version.json)

          if [ "$CURRENT_DATE" \< "$TODAY" ]; then
            jq --arg d "$TODAY" '.release_date = $d' info/version.json > info/version.json.tmp && \
              mv info/version.json.tmp info/version.json
            echo "date_updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "date_updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.run-script.outputs.version-updated == 'true' || steps.update_date.outputs.date_updated == 'true'
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9
        with:
          add: "info/version.json"
          default_author: github_actions
          message: "[BOT] Update services version and release date"
