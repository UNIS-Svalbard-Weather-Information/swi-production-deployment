name: Release on Merge

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch: {}

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture the shipped commit SHA
        # Captured before the (possibly-failing) date-bump commit below, so the
        # release/X.Y.Z marker always points at a commit that's actually pushed to
        # main - not a local-only commit that failed to push under branch protection.
        id: shipped
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Update release date if needed
        id: update_date
        run: |
          TODAY=$(date +'%Y-%m-%d')
          CURRENT_DATE=$(jq -r '.release_date' info/version.json)

          if [ "$CURRENT_DATE" != "$TODAY" ]; then
            jq --arg d "$TODAY" '.release_date = $d' info/version.json > info/version.json.tmp && \
               mv info/version.json.tmp info/version.json
            echo "date_updated=true" >> $GITHUB_OUTPUT
          else
            echo "date_updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push date update (if needed)
        if: steps.update_date.outputs.date_updated == 'true'
        # continue-on-error: main now requires PRs (repository rule), so this direct
        # push gets rejected (GH013) whenever the date is actually stale. That's just
        # a cosmetic field - it must not block the Create GitHub Release step below,
        # which is the actual point of this job. Confirmed via a real failed run: the
        # push failure was silently skipping every step after it.
        continue-on-error: true
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add info/version.json
          git commit -m "Update release date to $(date +'%Y-%m-%d')"
          git push

      - name: Get Version
        id: get_version
        run: |
          # info/version.json's .release is already the final version for this cycle -
          # it was kept continuously up to date by update-info.py while the staging
          # branch was open (see update_services_info.yml), no re-bump needed here.
          VERSION=$(jq -r '.release' info/version.json)
          VERSION_NAME=$(jq -r '.release_name' info/version.json)

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          release_name: ${{ steps.get_version.outputs.version }}
          body: "Release ${{ steps.get_version.outputs.version_name }} version ${{ steps.get_version.outputs.version }}"

      - name: Create the release/X.Y.Z historical marker branch
        # A pure snapshot, created once and never touched again - this is what
        # release/X.Y.Z means now (staging/X.Y.Z is the active, mutable branch - see
        # cut-next-staging-branch below). No lock/protection step needed: since
        # nothing ever pushes to it after creation, there's nothing to protect
        # against. The repo's release/** ruleset (create allowed, delete restricted)
        # already fits this purpose.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/heads/release/${{ steps.get_version.outputs.version }}" \
            -f sha="${{ steps.shipped.outputs.sha }}"

      - name: Sync pre-prod to match what just shipped
        # pre-prod's own ref never moves when its PR merges into main (merging a PR
        # advances the base branch, not the head branch), so pre-prod falls behind
        # main by everything just shipped and stays behind until something
        # explicitly catches it up. Confirmed for real: pre-prod ended up 13 commits
        # behind main after a single cycle, which is why the following staging ->
        # pre-prod promotion PR showed far more commits than the actual new work on
        # staging. main's new tip already contains 100% of what was on pre-prod
        # (that's what the merge which triggered this job just did), so this is
        # always a pure fast-forward - safe by construction, no PR needed for it (a
        # PR-based sync was tried first, but a PR for a pure housekeeping
        # fast-forward is unnecessary ceremony). This is a direct ref update, same
        # mechanism as the release/X.Y.Z marker creation above - it needs pre-prod's
        # branch protection to let this workflow's token bypass the "restrict
        # updates" rule (repo Settings -> Rules -> the ruleset covering pre-prod ->
        # add a bypass entry, e.g. for repository admins or this workflow). Until
        # that's set up, continue-on-error keeps this from failing the whole release
        # - pre-prod just stays behind until it's promoted through normally, same as
        # before this fix existed.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git rev-list origin/pre-prod..HEAD)" ]; then
            echo "pre-prod already matches main - nothing to sync."
            exit 0
          fi
          gh api --method PATCH "repos/${{ github.repository }}/git/refs/heads/pre-prod" \
            -f sha="${{ steps.shipped.outputs.sha }}"

  cut-next-staging-branch:
    # Starts the next staging/X.Y.Z cycle immediately after this one reaches
    # production: deletes the just-shipped staging branch (its content is fully
    # captured in main + the release/X.Y.Z marker just created above) and cuts a
    # fresh one, which just sits open collecting Renovate's image bumps (see
    # renovate.json) until someone promotes it via a PR into pre-prod.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete the just-shipped staging branch
        # Reconstructing the branch name from info/version.json.release isn't
        # reliable: the auto version-computation in update-info.py (see
        # update_services_info.yml) can recompute a different final version mid-cycle
        # based on the actual component bumps, without renaming the staging branch
        # itself. Confirmed for real: staging/2.0.2 ended up shipping as version
        # 2.0.3 - main's version.json said "2.0.3" here while the branch that
        # actually carried the content was still named staging/2.0.2, so the old
        # name-reconstruction looked for (and silently failed to find) a branch that
        # never existed, leaving staging/2.0.2 orphaned indefinitely. Instead, find
        # and delete every staging/** branch that's now a pure ancestor of main -
        # correct regardless of what it's named, since a promoted staging branch's
        # content is always fully captured in main by this point (that's what the
        # whole pipeline exists to guarantee).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for branch in $(gh api "repos/${{ github.repository }}/branches?per_page=100" \
            --jq '.[] | select(.name | startswith("staging/")) | .name'); do
            if [ -z "$(git rev-list "HEAD..origin/$branch" 2>/dev/null)" ]; then
              echo "$branch is fully merged into main - deleting."
              gh api --method DELETE "repos/${{ github.repository }}/git/refs/heads/$branch" || \
                echo "Could not delete $branch - continuing."
            else
              echo "$branch still has unmerged commits - leaving it."
            fi
          done

      - name: Compute next staging branch version
        id: next
        run: |
          VERSION=$(jq -r '.release' info/version.json)
          IFS='.' read -r major minor patch <<< "$VERSION"
          NEW_VERSION="${major}.${minor}.$((patch + 1))"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Write the new cycle's baseline
        # Must run BEFORE "Set placeholder next version" below: this snapshots
        # info/version.json.release as the baseline's anchor, and
        # compute_release_bump() in update-info.py always bumps from that anchor
        # (baseline["release"]), not from whatever the current placeholder says.
        # Confirmed for real: writing the baseline after the placeholder overwrite
        # baked "2.0.2" (the placeholder, itself already a +1-patch guess) into the
        # baseline, so a single genuine patch-level component change later computed
        # 2.0.2's own +1 patch = "2.0.3" - one bump too many for what was actually a
        # single patch-level change. Snapshotting while version.json.release still
        # holds the true last-shipped version (e.g. "2.0.1") fixes the anchor, so a
        # single patch-level change correctly lands on "2.0.2" - the same value the
        # placeholder already guessed - instead of overshooting past it.
        run: |
          pip install --quiet pyyaml
          python update-info.py --write-baseline

      - name: Set placeholder next version
        run: |
          jq --arg v "${{ steps.next.outputs.new_version }}" '.release = $v' info/version.json > info/version.json.tmp
          mv info/version.json.tmp info/version.json

      - name: Commit and push the new staging branch
        uses: EndBug/add-and-commit@v9
        with:
          add: "info/version.json info/.release-baseline.json"
          default_author: github_actions
          new_branch: "staging/${{ steps.next.outputs.new_version }}"
          message: "Start release cycle ${{ steps.next.outputs.new_version }}"

      - name: Trigger the pre-prod promotion PR check
        # The push above is authored by the default GITHUB_TOKEN, and GitHub never
        # fires another workflow's push trigger off a GITHUB_TOKEN-authored push (the
        # same anti-recursion guard that kept docker-build-push.yml from firing after
        # release-please tags) - so ensure-preprod-pr.yml's push: staging/** trigger
        # silently never catches this, and the new branch would sit unpromoted until
        # its daily fallback schedule next runs. workflow_dispatch is explicitly
        # exempt from that restriction, so dispatch it directly instead of waiting.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ensure-preprod-pr.yml --ref main
